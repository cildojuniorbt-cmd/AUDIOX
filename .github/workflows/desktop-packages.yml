name: AUDIOX Desktop Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  desktop:
    name: Build desktop installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: windows-exe
          - platform: macOS
            os: macos-latest
            artifact: macos-dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/app.svg
      - name: Install frontend dependencies
        run: npm install
      - name: Build desktop package
        run: npm run desktop:build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
